<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
    <title>Frontend Mentor | Job Listings</title>
  </head>
  <body>
    <!-- Decorative banner (background image in CSS) -->
    <header class="hero">
      <h1 class="sr-only">Job listings</h1>
    </header>

    <main class="container">
      <!-- Shown only when at least one filter is active -->
      <section class="filter-bar" id="filter-bar" aria-label="Active filters" hidden>
        <!-- Filter chips are rendered here -->
        <ul class="filter-bar__list" id="filter-list"></ul>
        <button class="filter-bar__clear" id="clear-btn" type="button">Clear</button>
      </section>

      <p class="jobs__error" id="job-error" role="alert" hidden></p>

      <!-- Job cards are rendered here -->
      <ul class="jobs" id="job-list"></ul>

      <!-- Screen reader announcement, e.g. "Showing 2 of 10 jobs" -->
      <p class="sr-only" id="job-status" role="status"></p>
    </main>

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="https://my-portfolio-frontend-kappa-lemon.vercel.app/">Josh</a>.
    </footer>

    <script type="module" src="./script.js"></script>
  </body>
</html>
